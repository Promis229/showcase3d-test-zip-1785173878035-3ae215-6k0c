<script>
(function(){
  var FRAME_COUNT = 90;
  var FRAMES_BASE = "frames/";
  var PRIORITY = Math.min(15, FRAME_COUNT);
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frameUrl(i){
    var n = String(Math.max(1, Math.min(FRAME_COUNT, i))).padStart(3,'0');
    return FRAMES_BASE + 'frame-' + n + '.webp';
  }

  var images = new Array(FRAME_COUNT);
  function loadImage(i){
    if (images[i]) return images[i];
    var img = new Image();
    img.decoding = 'async';
    img.src = frameUrl(i + 1);
    images[i] = img;
    return img;
  }
  for (var p = 0; p < PRIORITY; p++) loadImage(p);
  function idleLoadRest(){
    var i = PRIORITY;
    function step(){
      var batchEnd = Math.min(FRAME_COUNT, i + 6);
      for (; i < batchEnd; i++) loadImage(i);
      if (i < FRAME_COUNT) {
        if ('requestIdleCallback' in window) requestIdleCallback(step); else setTimeout(step, 50);
      }
    }
    step();
  }
  if ('requestIdleCallback' in window) requestIdleCallback(idleLoadRest); else setTimeout(idleLoadRest, 200);

  var bar = document.querySelector('.s3d-loadbar');
  var loadedCount = 0;
  images.forEach ? null : null;
  function trackLoad(img){
    img.addEventListener('load', function(){
      loadedCount++;
      if (bar) bar.style.width = Math.min(100, Math.round(loadedCount / FRAME_COUNT * 100)) + '%';
    }, { once: true });
  }

  var callbacks = [];
  var api = {
    onFrame: function(cb){ callbacks.push(cb); },
    getImage: function(i){ return loadImage(Math.max(0, Math.min(FRAME_COUNT - 1, i))); },
    frameCount: FRAME_COUNT,
    reducedMotion: reduced
  };
  window.Showcase3D = api;

  if (reduced) {
    // trois frames fixes : début / milieu / fin, aucune animation pilotée par le scroll
    [0, Math.floor(FRAME_COUNT/2), FRAME_COUNT - 1].forEach(function(idx, order){
      callbacks.forEach(function(cb){ cb(order / 2, idx); });
    });
    document.documentElement.classList.add('s3d-static');
    return;
  }

  var target = 0, current = 0, ticking = false;
  function computeTarget(){
    var stage = document.querySelector('.s3d-stage');
    if (!stage) return 0;
    var rect = stage.getBoundingClientRect();
    var total = rect.height - window.innerHeight;
    if (total <= 0) return 0;
    var scrolled = -rect.top;
    return Math.max(0, Math.min(1, scrolled / total));
  }
  function raf(){
    target = computeTarget();
    current += (target - current) * 0.1;
    if (Math.abs(target - current) < 0.0005) current = target;
    var frameIndex = Math.round(current * (FRAME_COUNT - 1));
    callbacks.forEach(function(cb){ cb(current, frameIndex); });
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);

  // pas de scroll-hijack : on laisse le navigateur gérer le scroll natif (tactile compris)
})();
</script>
<script>
(function(){
  var canvas = document.getElementById('s3dCanvas');
  var dctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
  resize(); addEventListener('resize', resize);
  var titles = Array.prototype.slice.call(document.querySelectorAll('.s3d-title'));
  function draw(progress, frameIndex){
    var img = window.Showcase3D.getImage(frameIndex);
    if (img && img.complete && img.naturalWidth) {
      var cw = canvas.width, ch = canvas.height;
      var ir = img.naturalWidth / img.naturalHeight, cr = cw / ch;
      var dw, dh, dx, dy;
      if (ir > cr) { dh = ch; dw = ch * ir; dx = (cw - dw) / 2; dy = 0; }
      else { dw = cw; dh = cw / ir; dx = 0; dy = (ch - dh) / 2; }
      dctx.clearRect(0,0,cw,ch);
      dctx.drawImage(img, dx, dy, dw, dh);
    }
    titles.forEach(function(t){
      var at = parseFloat(t.dataset.at);
      var d = Math.abs(progress - at);
      t.style.opacity = d < 0.1 ? String(1 - d / 0.1) : '0';
    });
  }
  window.Showcase3D.onFrame(draw);
})();</script>
